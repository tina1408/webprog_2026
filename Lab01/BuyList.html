<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BuyList</title>
    <style>
      * {
        box-sizing: border-box;
        font-family: 'Tahoma';
      }
 
      body {
        background-color: #d8d8d8;
        margin: 0;
        padding: 20px;
        color: #333;
      }

      .container {
        max-width: 1000px;
        margin: 0 auto;
        display: flex;
        gap: 20px;
      }
 
      @media (max-width: 650px) {
        .container {
          flex-direction: column;
        }
      }
 
      .left-panel {
        flex: 2;
        background: white;
        border-radius: 4px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      }
 
      .add-item-box {
        display: flex;
        padding: 20px;
        border-bottom: 2px solid #f0f0f0;
      }
 
      .add-item-box input {
        flex: 1;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 4px 0 0 4px;
        font-size: 16px;
        outline: none;
      }
 
      .add-item-box button {
        background-color: #2188d8;
        color: white;
        border: none;
        padding: 0 20px;
        font-size: 16px;
        font-weight: bold;
        border-radius: 0 4px 4px 0;
        cursor: pointer;
      }
 
      .item-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 15px 20px;
        border-bottom: 1px solid #f0f0f0;
      }
 
      .item-row:last-child {
        border-bottom: none;
      }
 
      .item-name {
        flex: 1;
        font-size: 18px;
      }
 
      .item-name input {
        font-size: 16px;
        padding: 8px;
        border: 1px solid #2188d8;
        border-radius: 4px;
        outline: none;
      }
 
      .item-controls {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
      }
 
      .qty-badge {
        background: #e9ecef;
        padding: 5px 15px;
        border-radius: 4px;
        font-weight: bold;
        min-width: 40px;
        text-align: center;
      }
 
      .btn-circle {
        width: 35px;
        height: 35px;
        border-radius: 50%;
        border: none;
        color: white;
        font-size: 20px;
        font-weight: bold;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }
 
      .btn-red {
        background-color: #db2828;
      }
 
      .btn-red.disabled {
        background-color: #f29c9c;
        cursor: default;
      }
 
      .btn-green {
        background-color: #21ba45;
      }
 
      .item-actions {
        flex: 1;
        display: flex;
        justify-content: flex-end;
        align-items: center;
        gap: 10px;
      }
 
      .btn-status {
        padding: 8px 15px;
        background: #f8f9fa;
        border: 1px solid #dee2e6;
        border-radius: 4px;
        font-weight: bold;
        color: #495057;
        cursor: pointer;
      }
 
      .btn-delete {
        width: 35px;
        height: 35px;
        background-color: #db2828;
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
      }
 
      .right-panel {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
 
      .stats-card {
        background: white;
        border-radius: 4px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      }
 
      .stats-card h2 {
        margin: 0;
        padding: 20px;
        border-bottom: 1px solid #f0f0f0;
        font-size: 22px;
      }
 
      .tags-container {
        padding: 20px;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
 
      .tag {
        background: #e9ecef;
        padding: 6px 12px;
        border-radius: 6px;
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 600;
        font-size: 14px;
      }
 
      .tag.crossed {
        text-decoration: line-through;
        color: #6c757d;
      }
 
      .tag-qty {
        background: #f2711c;
        color: white;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: bold;
      }
 
      .badge {
        position: fixed;
        bottom: 0;
        left: 20px;
        background-color: #4a148c;
        color: white;
        border-radius: 12px 12px 0 0;
        padding: 15px 25px;
        font-size: 16px;
        font-weight: bold;
        text-align: center;
        border: 2px solid transparent;
        transition: transform 0.4s ease, background-color 0.4s ease;
        transform: translateY(calc(100% - 50px));
        min-height: 100px;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        z-index: 1000;
      }
 
      .badge-title {
        height: 20px;
        line-height: 20px;
      }
 
      .badge-author {
        margin-top: 20px;
        opacity: 0;
        transition: opacity 0.3s ease;
        text-align: left;
      }
 
      .created-by {
        font-size: 14px;
        font-weight: normal;
      }
 
      .author-name {
        font-size: 18px;
        font-weight: bold;
        margin-top: 4px;
      }
 
      .badge:hover {
        transform: translateY(0);
        background-color: #7b1fa2;
      }
 
      .badge:hover .badge-author {
        opacity: 1;
      }
 
      @media print {
        body {
          background-color: white;
        }
 
        .badge {
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
          background-color: white !important;
          border: 2px solid #4a148c !important;
          color: #333 !important;
          transform: translateY(0) !important;
          min-height: auto;
          padding: 15px 20px;
          position: absolute;
          border-radius: 6px;
        }
 
        .badge-title {
          display: none !important;
        }
 
        .badge-author {
          display: block !important;
          opacity: 1 !important;
          margin-top: 0;
        }
      }
 
      [data-tooltip] {
        position: relative;
      }
 
      [data-tooltip]::after {
        content: attr(data-tooltip);
        position: absolute;
        bottom: 130%;
        left: 50%;
        transform: translateX(-50%) scale(0);
        transform-origin: bottom center;
        background-color: #4a148c;
        color: white;
        padding: 8px 12px;
        border-radius: 8px;
        font-size: 12px;
        font-weight: normal;
        white-space: nowrap;
        opacity: 0;
        pointer-events: none;
        transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
        z-index: 100;
      }
 
      [data-tooltip]:hover::after {
        transform: translateX(-50%) scale(1);
        opacity: 1;
      }
    </style>
  </head>
  <body>
 
    <div class="container">
 
      <div class="left-panel">
 
        <div class="add-item-box">
          <input type="text" placeholder="Назва товару">
          <button data-tooltip="Додати новий товар у список">Додати</button>
        </div>
 
        <div class="item-row">
          <div class="item-name">Помідори</div>
          <div class="item-controls">
            <span class="qty-badge">2</span>
          </div>
          <div class="item-actions">
            <button class="btn-status" data-tooltip="Товар ще не придбано">Не куплено</button>
          </div>
        </div>
 
        <div class="item-row">
          <div class="item-name">Печиво</div>
          <div class="item-controls">
            <button class="btn-circle btn-red" data-tooltip="Зменшити кількість">-</button>
            <span class="qty-badge">2</span>
            <button class="btn-circle btn-green" data-tooltip="Збільшити кількість">+</button>
          </div>
          <div class="item-actions">
            <button class="btn-status" data-tooltip="Позначити як не куплене">Куплено</button>
            <button class="btn-delete" data-tooltip="Видалити товар">×</button>
          </div>
        </div>
 
        <div class="item-row">
          <div class="item-name">
            <input type="text" value="Сир">
          </div>
          <div class="item-controls">
            <button class="btn-circle btn-red disabled" data-tooltip="Мінімальна кількість">-</button>
            <span class="qty-badge">1</span>
            <button class="btn-circle btn-green" data-tooltip="Збільшити кількість">+</button>
          </div>
          <div class="item-actions">
            <button class="btn-status" data-tooltip="Позначити як не куплене">Куплено</button>
            <button class="btn-delete" data-tooltip="Видалити товар">×</button>
          </div>
        </div>
 
      </div>
 
      <div class="right-panel">
 
        <div class="stats-card">
          <h2>Залишилося</h2>
          <div class="tags-container">
            <div class="tag">
              Печиво
              <div class="tag-qty">2</div>
            </div>
            <div class="tag">
              Сир
              <div class="tag-qty">1</div>
            </div>
          </div>
        </div>
 
        <div class="stats-card">
          <h2>Куплено</h2>
          <div class="tags-container">
            <div class="tag crossed">
              Помідори
              <div class="tag-qty">2</div>
            </div>
          </div>
        </div>
 
      </div>
 
    </div>
 
    <div class="badge">
      <div class="badge-title">BuyList</div>
      <div class="badge-author">
        <div class="created-by">Роботу виконала:</div>
        <div class="author-name">Ревчук Христина</div>
      </div>
    </div>
 
  </body>
</html>
