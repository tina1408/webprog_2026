<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BuyList</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Tahoma', sans-serif;
    }

    body {
      background-color: #d8d8d8;
      margin: 0;
      padding: 20px;
      color: #333;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      display: flex;
      gap: 20px;
    }

    @media (max-width: 650px) {
      .container {
        flex-direction: column;
      }
    }

    .left-panel {
      flex: 2;
      background: white;
      border-radius: 4px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    .add-item-box {
      display: flex;
      padding: 20px;
      border-bottom: 2px solid #f0f0f0;
    }

    .add-item-box input {
      flex: 1;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 4px 0 0 4px;
      font-size: 16px;
      outline: none;
    }

    .add-item-box button {
      background-color: #2188d8;
      color: white;
      border: none;
      padding: 0 20px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 0 4px 4px 0;
      cursor: pointer;
    }

    .item-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 20px;
      border-bottom: 1px solid #f0f0f0;
    }

    .item-row:last-child {
      border-bottom: none;
    }

    .item-name {
      flex: 1;
      font-size: 18px;
    }

    .item-name input {
      font-size: 16px;
      padding: 8px;
      border: 1px solid #2188d8;
      border-radius: 4px;
      outline: none;
      width: 90%;
    }

    .item-controls {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }

    .qty-badge {
      background: #e9ecef;
      padding: 5px 15px;
      border-radius: 4px;
      font-weight: bold;
      min-width: 40px;
      text-align: center;
    }

    .btn-circle {
      width: 35px;
      height: 35px;
      border-radius: 50%;
      border: none;
      color: white;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-red { background-color: #db2828; }
    .btn-red.disabled {
      background-color: #f29c9c;
      cursor: default;
    }
    .btn-green { background-color: #21ba45; }

    .item-actions {
      flex: 1;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 10px;
    }

    .btn-status {
      padding: 8px 15px;
      background: #f8f9fa;
      border: 1px solid #dee2e6;
      border-radius: 4px;
      font-weight: bold;
      color: #495057;
      cursor: pointer;
    }

    .btn-delete {
      width: 35px;
      height: 35px;
      background-color: #db2828;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .right-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .stats-card {
      background: white;
      border-radius: 4px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    .stats-card h2 {
      margin: 0;
      padding: 20px;
      border-bottom: 1px solid #f0f0f0;
      font-size: 22px;
    }

    .tags-container {
      padding: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .tag {
      background: #e9ecef;
      padding: 6px 12px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 14px;
    }

    .tag.crossed {
      text-decoration: line-through;
      color: #6c757d;
    }

    .tag-qty {
      background: #f2711c;
      color: white;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: bold;
    }

    .badge {
      position: fixed;
      bottom: 0;
      left: 20px;
      background-color: #4a148c;
      color: white;
      border-radius: 12px 12px 0 0;
      padding: 15px 25px;
      font-size: 16px;
      font-weight: bold;
      text-align: center;
      border: 2px solid transparent;
      transition: transform 0.4s ease, background-color 0.4s ease;
      transform: translateY(calc(100% - 50px));
      min-height: 100px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      z-index: 1000;
    }

    .badge-title { height: 20px; line-height: 20px; }
    .badge-author {
      margin-top: 20px;
      opacity: 0;
      transition: opacity 0.3s ease;
      text-align: left;
    }
    .created-by { font-size: 14px; font-weight: normal; }
    .author-name { font-size: 18px; font-weight: bold; margin-top: 4px; }

    .badge:hover {
      transform: translateY(0);
      background-color: #7b1fa2;
    }
    .badge:hover .badge-author { opacity: 1; }

    @media print {
      body { 
        background-color: white; 
      }
      
      .badge {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
        background-color: white;
        border: 2px solid #4a148c;
        color: #333;
        transform: translateY(0);
        min-height: auto;
        padding: 15px 20px;
        position: absolute;
        border-radius: 6px;
      }
      
      .badge-title { 
        display: none; 
      }
      
      .badge-author {
        display: block;
        opacity: 1;
        margin-top: 0;
      }
    }

    [data-tooltip] { position: relative; }
    [data-tooltip]::after {
      content: attr(data-tooltip);
      position: absolute;
      bottom: 130%;
      left: 50%;
      transform: translateX(-50%) scale(0);
      transform-origin: bottom center;
      background-color: #4a148c;
      color: white;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: normal;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
      z-index: 100;
    }
    [data-tooltip]:hover::after {
      transform: translateX(-50%) scale(1);
      opacity: 1;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="left-panel">
      <div class="add-item-box">
        <input type="text" id="new-item-input" placeholder="Назва товару">
        <button id="add-item-btn" data-tooltip="Додати новий товар у список">Додати</button>
      </div>
      <div id="items-container"></div>
    </div>

    <div class="right-panel">
      <div class="stats-card">
        <h2>Залишилося</h2>
        <div class="tags-container" id="left-tags"></div>
      </div>
      <div class="stats-card">
        <h2>Куплено</h2>
        <div class="tags-container" id="right-tags"></div>
      </div>
    </div>
  </div>

  <div class="badge">
    <div class="badge-title">BuyList</div>
    <div class="badge-author">
      <div class="created-by">Роботу виконала:</div>
      <div class="author-name">Ревчук Христина</div>
    </div>
  </div>

  <script>
    const defaultItems = [
      { id: 1, name: 'Помідори', amount: 2, isBought: true },
      { id: 2, name: 'Печиво', amount: 2, isBought: false },
      { id: 3, name: 'Сир', amount: 1, isBought: false }
    ];

    let items = JSON.parse(localStorage.getItem('tinaBuyList')) || defaultItems;

    const itemsContainer = document.getElementById('items-container');
    const inputField = document.getElementById('new-item-input');
    const addBtn = document.getElementById('add-item-btn');
    const leftTags = document.getElementById('left-tags');
    const rightTags = document.getElementById('right-tags');

    function saveAndRender() {
      localStorage.setItem('tinaBuyList', JSON.stringify(items));
      renderList();
      renderStats();
    }

    function renderList() {
      itemsContainer.innerHTML = '';

      items.forEach(item => {
        const row = document.createElement('div');
        row.className = 'item-row';

        const nameDiv = document.createElement('div');
        nameDiv.className = 'item-name';
        
        if (item.isBought) {
          nameDiv.style.textDecoration = 'line-through';
          nameDiv.style.color = '#888';
          nameDiv.textContent = item.name;
        } else {
          nameDiv.textContent = item.name;
          nameDiv.style.cursor = 'pointer';
          nameDiv.setAttribute('data-tooltip', 'Клікніть, щоб редагувати назву');
          
          nameDiv.addEventListener('click', () => {
            const editInput = document.createElement('input');
            editInput.type = 'text';
            editInput.value = item.name;
            
            nameDiv.innerHTML = '';
            nameDiv.removeAttribute('data-tooltip');
            nameDiv.appendChild(editInput);
            editInput.focus();

            const saveEdit = () => {
              const newName = editInput.value.trim();
              if (newName) item.name = newName;
              saveAndRender();
            };

            editInput.addEventListener('blur', saveEdit);
            editInput.addEventListener('keypress', (e) => {
              if (e.key === 'Enter') saveEdit();
            });
          });
        }

        const controlsDiv = document.createElement('div');
        controlsDiv.className = 'item-controls';

        if (!item.isBought) {
          const minusBtn = document.createElement('button');
          minusBtn.className = `btn-circle btn-red ${item.amount === 1 ? 'disabled' : ''}`;
          minusBtn.textContent = '-';
          minusBtn.setAttribute('data-tooltip', 'Зменшити кількість');
          if (item.amount > 1) {
            minusBtn.onclick = () => { item.amount--; saveAndRender(); };
          }

          const qtyBadge = document.createElement('span');
          qtyBadge.className = 'qty-badge';
          qtyBadge.textContent = item.amount;

          const plusBtn = document.createElement('button');
          plusBtn.className = 'btn-circle btn-green';
          plusBtn.textContent = '+';
          plusBtn.setAttribute('data-tooltip', 'Збільшити кількість');
          plusBtn.onclick = () => { item.amount++; saveAndRender(); };

          controlsDiv.append(minusBtn, qtyBadge, plusBtn);
        }

        const actionsDiv = document.createElement('div');
        actionsDiv.className = 'item-actions';

        const statusBtn = document.createElement('button');
        statusBtn.className = 'btn-status';
        statusBtn.textContent = item.isBought ? 'Не куплено' : 'Куплено';
        statusBtn.setAttribute('data-tooltip', item.isBought ? 'Повернути в список покупок' : 'Позначити як придбане');
        statusBtn.onclick = () => {
          item.isBought = !item.isBought;
          saveAndRender();
        };
        actionsDiv.appendChild(statusBtn);

        if (!item.isBought) {
          const deleteBtn = document.createElement('button');
          deleteBtn.className = 'btn-delete';
          deleteBtn.textContent = '×';
          deleteBtn.setAttribute('data-tooltip', 'Видалити товар');
          deleteBtn.onclick = () => {
            items = items.filter(i => i.id !== item.id);
            saveAndRender();
          };
          actionsDiv.appendChild(deleteBtn);
        }

        row.append(nameDiv, controlsDiv, actionsDiv);
        itemsContainer.appendChild(row);
      });
    }

    function renderStats() {
      leftTags.innerHTML = '';
      rightTags.innerHTML = '';

      items.forEach(item => {
        const tag = document.createElement('div');
        tag.className = item.isBought ? 'tag crossed' : 'tag';
        tag.innerHTML = `
          ${item.name}
          <div class="tag-qty">${item.amount}</div>
        `;
        
        if (item.isBought) {
          rightTags.appendChild(tag);
        } else {
          leftTags.appendChild(tag);
        }
      });
    }

    function addItem() {
      const name = inputField.value.trim();
      if (name) {
        items.push({
          id: Date.now(),
          name: name,
          amount: 1,
          isBought: false
        });
        inputField.value = '';
        saveAndRender();
      }
      inputField.focus(); 
    }

    addBtn.addEventListener('click', addItem);
    inputField.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') addItem();
    });

    saveAndRender();
  </script>
</body>
</html>
